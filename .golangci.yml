version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  default: none
  enable:
    - govet
    - errcheck
    - staticcheck
    - ineffassign
    - unused
    - misspell
    - revive
    - gocyclo
    - gosec

  settings:
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: empty-block
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: increment-decrement
        - name: indent-error-flow
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: time-naming
        - name: var-declaration
        - name: var-naming
        # Left out until the stubbed packages are implemented, then re-enabled
        # (#118): `exported` wants a doc comment on every exported stub, and
        # `unused-parameter` fires on every not-yet-implemented body.
    gosec:
      excludes:
        # Opening a caller-supplied path is what a desktop file tool does, and
        # the flagged call sites take paths the application derived itself.
        - G304
        # Matches the word "password" in error text and test fixtures.
        - G101
  exclusions:
    paths:
      - frontend/node_modules
      - frontend/dist

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
