[pytest]
minversion = 9.1
testpaths = e2e/live/critical
python_files = test_*.py
pythonpath = .
addopts =
    -ra
    --strict-markers
    --browser chromium
    --base-url http://127.0.0.1:4173
    --tracing retain-on-failure
    --video retain-on-failure
    --screenshot only-on-failure
    --output test-results
    --html playwright-report/index.html
timeout = 60
