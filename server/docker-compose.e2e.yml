# Overlay the development fixture with disposable, independently named services.
# Requires Docker Compose 2.24.4+ for !override. The test runner supplies a unique
# project name, so parallel runs never touch the developer's LDAP data or ports.
services:
  certs:
    container_name: !reset null
  openldap:
    container_name: !reset null
    ports: !override
      - "127.0.0.1::1389"
      - "127.0.0.1::1636"
