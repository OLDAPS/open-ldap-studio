name: Release

on:
  push:
    branches: ["main"]
  # A dry run: builds, packages and install-tests every installer, but
  # publishes nothing and leaves the release pull request alone.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Maintains a rolling "chore(main): release x.y.z" pull request built from
  # conventional commits. Merging that pull request is what cuts a release: it
  # writes CHANGELOG.md, stamps the version into internal/version/version.go,
  # frontend/package.json and wails.json, tags vX.Y.Z, and publishes the GitHub
  # Release.
  release-please:
    name: Release Please
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      released: ${{ steps.release.outputs.releases_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Only for the push that merged the release pull request (or a manual dry
  # run). The packaging itself is shared with ci.yml.
  package:
    name: Package
    needs: release-please
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.released == 'true') }}
    uses: ./.github/workflows/package.yml
    with:
      retention-days: 30

  # Attaches the installers and a SHA256SUMS covering all of them to the
  # release, once every platform has produced its files.
  publish:
    name: Publish assets
    needs: [release-please, package]
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.release-please.outputs.tag }}
      VERSION: ${{ needs.release-please.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          merge-multiple: true
          path: dist

      # The assets are named from internal/version, the release from the tag.
      # If Release Please and the version file ever disagree, fail here rather
      # than publish installers labelled with the wrong version.
      - name: Check the assets are for this release
        run: |
          set -euo pipefail
          ls -la dist
          for f in \
            "open-ldap-studio_${VERSION}_linux-amd64.deb" \
            "open-ldap-studio_${VERSION}_linux-amd64.tar.gz" \
            "open-ldap-studio_${VERSION}_darwin-universal.dmg" \
            "open-ldap-studio_${VERSION}_windows-amd64-setup.exe"; do
            test -f "dist/$f" || { echo "missing dist/$f for release $TAG" >&2; exit 1; }
          done

      - name: Write SHA256SUMS
        working-directory: dist
        run: |
          sha256sum open-ldap-studio_* > SHA256SUMS
          cat SHA256SUMS

      - name: Attach to the release
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
