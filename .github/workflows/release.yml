name: Release

on:
  push:
    branches: ["main"]

permissions:
  contents: read

env:
  GO_VERSION: "1.26"
  NODE_VERSION: "22"
  WAILS_VERSION: v2.15.0
  MODULE: github.com/open-ldap-studio/open-ldap-studio

jobs:
  # Maintains a rolling "chore(main): release x.y.z" pull request built from
  # conventional commits. Merging that pull request is what cuts a release: it
  # writes CHANGELOG.md, stamps the version into internal/version/version.go
  # and frontend/package.json, tags vX.Y.Z, and publishes the GitHub Release.
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      released: ${{ steps.release.outputs.releases_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Only runs on the push that merged the release pull request.
  build:
    name: Package ${{ matrix.name }}
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-amd64
          - os: macos-latest
            name: darwin-universal
          - os: windows-latest
            name: windows-amd64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Resolve build stamps
        id: stamp
        shell: bash
        run: |
          echo "ldflags=-X ${MODULE}/internal/version.Commit=${GITHUB_SHA::12} -X ${MODULE}/internal/version.Date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: wails build -clean -tags webkit2_41 -ldflags "${{ steps.stamp.outputs.ldflags }}"

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: wails build -clean -platform darwin/universal -ldflags "${{ steps.stamp.outputs.ldflags }}"

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: wails build -clean -ldflags "${{ steps.stamp.outputs.ldflags }}"

      - name: Package
        id: package
        shell: bash
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
          NAME: ${{ matrix.name }}
        run: |
          set -euo pipefail
          asset="open-ldap-studio_${VERSION}_${NAME}"
          cd build/bin
          if [ "$RUNNER_OS" = "Linux" ]; then
            tar -czf "../../${asset}.tar.gz" open-ldap-studio
            echo "asset=${asset}.tar.gz" >> "$GITHUB_OUTPUT"
          elif [ "$RUNNER_OS" = "macOS" ]; then
            ditto -c -k --keepParent "open-ldap-studio.app" "../../${asset}.zip"
            echo "asset=${asset}.zip" >> "$GITHUB_OUTPUT"
          else
            7z a "../../${asset}.zip" "open-ldap-studio.exe"
            echo "asset=${asset}.zip" >> "$GITHUB_OUTPUT"
          fi

      - name: Attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.release-please.outputs.tag }}" "${{ steps.package.outputs.asset }}" --clobber

  # A single SHA256SUMS covering every asset, written once all three are up.
  checksums:
    name: Checksums
    needs: [release-please, build]
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download the published assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "${{ needs.release-please.outputs.tag }}" --dir dist --pattern 'open-ldap-studio_*'

      - name: Write and attach SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum open-ldap-studio_* > SHA256SUMS
          cat SHA256SUMS
          gh release upload "${{ needs.release-please.outputs.tag }}" SHA256SUMS --clobber
