name: CI

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

# A new push to a pull request makes the run in flight irrelevant.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  WAILS_VERSION: v2.15.0

jobs:
  # Release Please derives the next version and the changelog from commit
  # subjects, so a non-conforming title silently produces a wrong release.
  # Squash-merging means the pull request title becomes that subject.
  pr-title:
    name: Conventional pull request title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            revert
            refactor
            docs
            build
            ci
            test
            style
            chore

  frontend:
    name: Frontend lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Lint
        working-directory: ./frontend
        run: npm run lint

      - name: Format check
        working-directory: ./frontend
        run: npx prettier --check "src/**/*.{ts,tsx,css}"

      - name: Test with coverage
        working-directory: ./frontend
        run: npm run test:coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 14

      - name: Build
        working-directory: ./frontend
        run: npm run build

  go:
    name: Go lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # only-new-issues below diffs against the base branch, which has to
          # be in the local history for the diff to exist.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      # main.go embeds frontend/dist, which is not committed. Without it every
      # Go command in this job fails to compile, lint included.
      - name: Build the embedded frontend
        working-directory: ./frontend
        run: npm ci && npm run build

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0

      # Race detector and coverage run once, on Linux; the matrix covers the
      # per-platform code paths.
      - name: Race tests and coverage
        run: go test -short -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: coverage.out
          retention-days: 14

  # The live tests in internal/bridge start a seeded OpenLDAP with
  # testcontainers (test/containers), so this job needs only the Docker daemon
  # that ubuntu-latest already has. Without Docker they fail, not skip.
  integration:
    name: Integration tests (testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Integration tests
        run: go test -count=1 -v -tags=integration ./internal/bridge/ ./test/containers/...

  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Build the embedded frontend
        working-directory: ./frontend
        run: npm ci && npm run build

      # keychain_darwin.go, wincred_windows.go and secretservice_linux.go each
      # compile on one platform only, so Linux-only testing never reaches two
      # of the three credential bindings.
      - name: Unit tests
        run: go test -short ./...

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: wails build -tags webkit2_41 -clean

      - name: Build (macOS, Windows)
        if: runner.os != 'Linux'
        run: wails build -clean

      # The packaged binary has to start and say what it is. --version returns
      # before the window opens, so no display is needed. The Windows build is a
      # GUI-subsystem executable, which has no console of its own, so its output
      # is redirected to a file rather than read from the terminal.
      - name: Smoke test the built binary
        shell: bash
        run: |
          set -euo pipefail
          expected=$(sed -n 's/^const Version = "\([^"]*\)".*/\1/p' internal/version/version.go)
          case "$RUNNER_OS" in
            Linux)   bin=build/bin/open-ldap-studio ;;
            macOS)   bin=build/bin/open-ldap-studio.app/Contents/MacOS/open-ldap-studio ;;
            Windows) bin=build/bin/open-ldap-studio.exe ;;
          esac
          if [ "$RUNNER_OS" = "Windows" ]; then
            powershell -NoProfile -Command "Start-Process -FilePath '$bin' -ArgumentList '--version' -RedirectStandardOutput smoke.txt -Wait -NoNewWindow"
            out=$(cat smoke.txt)
          else
            out=$("$bin" --version)
          fi
          echo "binary says: $out"
          case "$out" in
            "$expected "*) echo "version $expected confirmed" ;;
            *) echo "expected a line starting with '$expected '"; exit 1 ;;
          esac

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: open-ldap-studio-${{ runner.os }}
          path: build/bin/
          retention-days: 7
