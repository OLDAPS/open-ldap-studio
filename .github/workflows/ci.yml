name: CI

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

# A new push to a pull request makes the run in flight irrelevant.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  # Release Please derives the next version and the changelog from commit
  # subjects, so a non-conforming title silently produces a wrong release.
  # Squash-merging means the pull request title becomes that subject.
  pr-title:
    name: Conventional pull request title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            revert
            refactor
            docs
            build
            ci
            test
            style
            chore

  # The local git hooks (.githooks/) mirror these gates. Their helpers and the
  # commit-msg rule are plain bash, so they are tested here; the check also
  # fails if the Makefile's pinned golangci-lint drifts from the one below.
  hooks:
    name: Git hooks tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test the hooks
        run: bash .githooks/tests/run.sh

  # The spec tooling and the consistency of the spec documents (scripts/spec).
  # Python standard library only, so there is nothing to install: the runner's
  # own python3 is enough. Offline: it reads the repository and nothing else.
  spec:
    name: Spec consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tool tests
        run: python3 -m unittest discover -s scripts/spec/tests -v

      - name: Spec consistency
        run: python3 scripts/spec/check.py --notes

  frontend:
    name: Frontend lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Lint
        working-directory: ./frontend
        run: npm run lint

      - name: Format check
        working-directory: ./frontend
        run: npx prettier --check "src/**/*.{ts,tsx,css}"

      - name: Test with coverage
        working-directory: ./frontend
        run: npm run test:coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 14

      - name: Build
        working-directory: ./frontend
        run: npm run build

  go:
    name: Go lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # only-new-issues below diffs against the base branch, which has to
          # be in the local history for the diff to exist.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      # main.go embeds frontend/dist, which is not committed. Without it every
      # Go command in this job fails to compile, lint included.
      - name: Build the embedded frontend
        working-directory: ./frontend
        run: npm ci && npm run build

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0

      # Race detector and coverage run once, on Linux; the matrix covers the
      # per-platform code paths.
      - name: Race tests and coverage
        run: go test -short -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: coverage.out
          retention-days: 14

  # The live tests in internal/bridge start a seeded OpenLDAP with
  # testcontainers (test/containers), so this job needs only the Docker daemon
  # that ubuntu-latest already has. Without Docker they fail, not skip.
  integration:
    name: Integration tests (testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Integration tests
        run: go test -count=1 -v -tags=integration ./internal/bridge/ ./test/containers/...

  # Supply-chain gates (T010): the module checksums, known vulnerabilities in the
  # Go dependency graph, and high-severity advisories in the frontend's.
  # govulncheck is pinned so a new scanner release cannot change a result on a
  # pull request that touched nothing; bump it deliberately.
  gates:
    name: gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0

      - name: Go mod verify
        run: go mod verify

      - name: Go vulnerability check
        run: govulncheck ./...

      - name: npm audit
        working-directory: ./frontend
        run: npm audit --audit-level=high

  # Unit tests on every platform: keychain_darwin.go, wincred_windows.go and
  # secretservice_linux.go each compile on one platform only, so Linux-only
  # testing never reaches two of the three credential bindings.
  unit:
    name: Unit tests ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Build the embedded frontend
        working-directory: ./frontend
        run: npm ci && npm run build

      - name: Unit tests
        run: go test -short ./...

  # Builds, packages and installs the application on all three platforms; the
  # installers are downloadable from the run, so a reviewer can try a pull
  # request. The same workflow produces the release assets.
  package:
    name: Package
    uses: ./.github/workflows/package.yml
